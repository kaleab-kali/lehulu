<!doctype html>
<!--
  Proof that Lehulu works outside Savanna: no Bootstrap, no Savanna CSS, no other script.
  On another site this is all it takes (replace YOUR-LEHULU-HOST):
    <script type="module" src="https://YOUR-LEHULU-HOST/lehulu.js"></script>
    <lehulu-signup lang="am"></lehulu-signup>
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lehulu on a blank page</title>
  </head>
  <body>
    <main>
      <h1>Sign up</h1>
      <lehulu-signup lang="en" jobs-url="jobs/" profile-url="jobs/#profile"></lehulu-signup>
    </main>
    <script type="module" src="/src/lehulu.ts"></script>
  </body>
</html>
