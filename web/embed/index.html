<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lehulu</title>
    <style>body{margin:0;padding:12px;font:16px/1.5 system-ui,sans-serif}</style>
  </head>
  <body>
    <!--
      For hosts that block scripts but allow iframes (most LMSs and job portals):
      <iframe src="https://YOUR-LEHULU-HOST/embed/?flow=signup&lang=am" title="Lehulu sign-up"
              style="width:100%;min-height:640px;border:0" allow="microphone"></iframe>
    -->
    <main id="embed"></main>
    <script type="module">
      import '../src/lehulu.ts';
      const q = new URLSearchParams(location.search);
      const screens = { jobs: 'lehulu-jobs', profile: 'lehulu-profile', partner: 'lehulu-partner', employer: 'lehulu-employer' };
      const flow = ['signup', 'apply', ...Object.keys(screens)].includes(q.get('flow')) ? q.get('flow') : 'signup';
      const lang = q.get('lang') === 'am' ? 'am' : 'en';
      document.documentElement.lang = lang;
      const el = document.createElement(screens[flow] ?? 'lehulu-signup');
      if (!screens[flow]) el.setAttribute('flow', flow);
      el.setAttribute('lang', lang);
      if (q.get('job')) el.setAttribute('job-id', q.get('job'));
      document.getElementById('embed').append(el);
    </script>
  </body>
</html>
