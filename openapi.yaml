  "tags": [
    {
      "name": "auth",
      "description": "Sign in. Learner sessions never time out; partner and employer tokens last 12 hours."
    },
    {
      "name": "learners",
      "description": "Sign-up and profile. No disability field exists. Only the learner can read their account."
    },
    {
      "name": "drafts",
      "description": "Autosave and continue later. No time limits."
    },
    {
      "name": "jobs",
      "description": "Jobs and the support they offer. JSON-LD available. Employers post jobs."
    },
    {
      "name": "applications",
      "description": "Support needs shared only with consent, per job. Only the job's employer reads them."
    },
    {
      "name": "partners",
      "description": "Partners confirm learners without ID documents and register learners with their consent."
    },
    {
      "name": "media",
      "description": "Voice answers. The recording itself is the answer; no speech service needed."
    },
    {
      "name": "flows",
      "description": "The JSON question flows used by every screen."
    }
  ]
